plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.shieldfl.edge'
    compileSdk 34

    defaultConfig {
        applicationId "com.shieldfl.edge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-prototype"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // ONNX Runtime Mobile — runs the quantized SMSFraudCNN on-device
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'

    // Retrofit — REST calls to Provider tier (FastAPI backend)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Room — local storage for pending feedback before sync
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines for async SMS processing / network calls
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
